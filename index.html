  <style>
/* ============================================================
   剪辑师个人作品集 — 样式表
   设计令牌还原自 Ardot 设计稿：
   画布 #0A0A0A / 导航与区块 #141414 / 卡片 #1A1A1A / 图标底 #242424
   发丝线 #292929 / 信号绿 #9EFF00 / 正文 #A3A3A3 / 弱文本 #8A8A8A（WCAG AA）
   大区块圆角 0 / 按钮 6px / 胶囊 100px
   ============================================================ */

:root {
  --bg: #0A0A0A;
  --bg-nav: #141414;
  --bg-section: #141414;
  --bg-works: #101010;
  --card: #1A1A1A;
  --card-2: #242424;
  --line: #292929;
  --accent: #9EFF00;
  --text: #FFFFFF;
  --text-2: #A3A3A3;
  --text-3: #8A8A8A;
  --text-4: #808080;
  --font-cjk: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-en: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
section[id], main[id] { scroll-margin-top: 80px; }
.skip-link {
  position: fixed; left: 16px; top: -80px; z-index: 1000;
  padding: 10px 18px; background: var(--accent); color: #000;
  font-size: 14px; font-weight: 600; border-radius: 6px;
  transition: top .2s ease;
}
.skip-link:focus { top: 12px; }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 3px;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-cjk);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

::selection { background: var(--accent); color: #000; }

/* ---------- 通用 ---------- */
.container { max-width: 1440px; margin: 0 auto; }
.kicker {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-en); font-size: 12px; font-weight: 500;
  letter-spacing: 2px; color: var(--text-3);
}
.kicker::before { content: ''; width: 24px; height: 2px; background: var(--accent); flex: none; }
.kicker-dot { width: 8px; height: 8px; background: var(--accent); flex: none; }
.kicker-dot-wrap { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-en); font-size: 12px; font-weight: 500; letter-spacing: 2px; color: var(--text-2); }

.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
.sec-title { font-size: 40px; font-weight: 600; line-height: 1.15; letter-spacing: 0.5px; }
.sec-index { font-family: var(--font-en); font-size: 12px; font-weight: 500; letter-spacing: 2px; color: var(--text-4); padding-bottom: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: 52px; padding: 0 28px; border-radius: 6px;
  font-size: 15px; font-weight: 500; letter-spacing: 0.5px;
  transition: transform .18s ease, opacity .18s ease;
  white-space: nowrap;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { opacity: 0.88; }
.btn-ghost { border: 1px solid rgba(255,255,255,0.25); color: var(--text); }
.btn-ghost:hover { border-color: rgba(255,255,255,0.5); }
.btn-nav { height: 38px; padding: 0 22px; font-size: 13px; background: var(--accent); color: #000; border-radius: 6px; font-weight: 500; }

.tag-pill {
  display: inline-flex; align-items: center; height: 34px; padding: 0 18px;
  border: 1px solid rgba(255,255,255,0.18); border-radius: 100px;
  font-size: 13px; color: var(--text-2);
}

.card { background: var(--card); border: 1px solid var(--line); }

/* ---------- 导航栏 ---------- */
.nav {
  position: sticky; top: 0; z-index: 100;
  height: 64px; background: var(--bg-nav);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 80px;
}
.nav-brand { display: flex; align-items: center; gap: 12px; }
.nav-brand-glyph { width: 14px; height: 14px; background: var(--accent); flex: none; }
.nav-brand-text { display: flex; flex-direction: column; gap: 2px; line-height: 1; }
.nav-brand-name { font-size: 15px; font-weight: 600; }
.nav-brand-role { font-family: var(--font-en); font-size: 11px; font-weight: 500; letter-spacing: 1.5px; color: var(--text-3); }
.nav-links { display: flex; align-items: center; gap: 36px; }
.nav-link { font-size: 14px; color: var(--text-2); transition: color .15s; position: relative; padding: 4px 0; }
.nav-link:hover, .nav-link.active { color: var(--text); }
.nav-link.active::after {
  content: ''; position: absolute; left: 50%; transform: translateX(-50%);
  bottom: -6px; width: 16px; height: 2px; background: var(--accent);
}
.nav-right { display: flex; align-items: center; gap: 16px; }
.nav-menu-btn { display: none; width: 40px; height: 40px; align-items: center; justify-content: center; }
.nav-menu-btn svg { width: 20px; height: 14px; }
.mobile-menu {
  display: none; position: fixed; top: 64px; left: 0; right: 0; z-index: 99;
  background: var(--bg-nav); border-bottom: 1px solid var(--line);
  padding: 12px 20px 20px;
}
.mobile-menu.open { display: block; }
@media (min-width: 901px) { .mobile-menu.open { display: none; } }
.mobile-menu a { display: block; padding: 14px 4px; font-size: 15px; color: var(--text-2); border-bottom: 1px solid var(--line); }
.mobile-menu a:last-child { border-bottom: none; }
.mobile-menu a.active { color: var(--text); }

/* ---------- Hero 首屏 ---------- */
.hero {
  display: flex; align-items: center; gap: 56px;
  padding: 88px 80px 64px;
}
.hero-left { width: 620px; flex: none; display: flex; flex-direction: column; gap: 26px; }
.hero-headline { font-size: 72px; font-weight: 600; line-height: 1.12; letter-spacing: 1px; white-space: pre-line; }
.hero-sub { font-size: 16px; color: var(--text-2); line-height: 1.75; max-width: 540px; }
.hero-cta { display: flex; gap: 16px; }
.hero-tags { display: flex; gap: 12px; flex-wrap: wrap; }
.hero-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.showreel {
  position: relative; aspect-ratio: 16/9; background: var(--card);
  border: 1px solid var(--line); overflow: hidden;
}
.showreel img { transition: transform .6s ease; }
.showreel:hover img { transform: scale(1.03); }
.play-btn {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 76px; height: 76px; border-radius: 100px; background: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  transition: transform .2s ease;
}
.play-btn:hover { transform: translate(-50%, -50%) scale(1.06); }
.play-btn svg { width: 22px; height: 18px; margin-left: 3px; }
.dur-pill {
  position: absolute; right: 20px; bottom: 20px; height: 30px; padding: 0 14px;
  background: rgba(0,0,0,0.6); border-radius: 100px;
  display: inline-flex; align-items: center;
  font-family: var(--font-en); font-size: 11px; font-weight: 500; letter-spacing: 1px; color: #fff;
}
.showreel-caption { display: flex; justify-content: space-between; align-items: center; }
.showreel-caption .cap-l { font-size: 13px; color: var(--text-2); }
.showreel-caption .cap-r { font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; }

.scroll-hint {
  height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font-en); font-size: 11px; font-weight: 500; letter-spacing: 2px; color: var(--text-4);
}
.scroll-hint::after { content: ''; width: 1px; height: 14px; background: var(--text-4); animation: drop 1.6s ease infinite; }
@keyframes drop { 0%,100% { transform: scaleY(0.4); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } }

/* ---------- 个人简介 ---------- */
.about { background: var(--bg-section); padding: 88px 80px 64px; display: flex; flex-direction: column; gap: 44px; }
.about-body { display: flex; gap: 56px; align-items: flex-start; }
.portrait-col { width: 300px; flex: none; display: flex; flex-direction: column; gap: 16px; }
.portrait { width: 300px; height: 375px; background: #1F1F1F; border: 1px solid var(--line); overflow: hidden; }
.portrait-name { font-size: 20px; font-weight: 600; }
.portrait-role { font-size: 13px; color: var(--text-2); }
.about-text-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.bio { font-size: 15px; color: #C9C9C9; line-height: 1.8; }
.intent-card { background: var(--card); border: 1px solid var(--line); }
.intent-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; }
.intent-row + .intent-row { border-top: 1px solid var(--line); }
.intent-row .l { font-size: 12px; color: var(--text-3); }
.intent-row .v { font-size: 14px; font-weight: 500; }

.spec-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.spec-card { background: var(--card); border: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column; gap: 14px; transition: border-color .2s; }
.spec-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.spec-card:hover { border-color: #3A3A3A; }
.spec-icon-box { width: 44px; height: 44px; background: var(--card-2); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.spec-icon-box svg { width: 22px; height: 22px; }
.spec-name { font-size: 20px; font-weight: 600; }
.spec-desc { font-size: 13px; color: var(--text-2); line-height: 1.7; }
.spec-tags { font-size: 12px; color: var(--text-4); margin-top: auto; }

.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat-cell { background: var(--card); border: 1px solid var(--line); padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; }
.stat-num { font-family: var(--font-en); font-size: 30px; font-weight: 600; line-height: 1.1; }
.stat-label { font-size: 12px; color: var(--text-2); }

/* ---------- 精选作品 ---------- */
.works { background: var(--bg-works); padding: 88px 80px; display: flex; flex-direction: column; gap: 40px; }
.works-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.work-card { background: #141414; border: 1px solid var(--line); display: flex; flex-direction: column; transition: border-color .2s, transform .2s; }
.work-card:hover { border-color: #3A3A3A; transform: translateY(-2px); }
.work-cover { position: relative; aspect-ratio: 16/9; background: var(--card); overflow: hidden; }
.work-cover img { transition: transform .6s ease; }
.work-card:hover .work-cover img { transform: scale(1.04); }
.work-cover .play-btn { width: 56px; height: 56px; }
.work-cover .play-btn svg { width: 20px; height: 16px; }
.play-badge {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 56px; height: 56px; border-radius: 100px; background: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  pointer-events: none; transition: transform .25s ease;
}
.play-badge svg { width: 20px; height: 16px; }
.work-card:hover .play-badge { transform: translate(-50%, -50%) scale(1.1); }
.work-cover .dur-pill { height: 26px; padding: 0 12px; right: 16px; bottom: 16px; }
.work-meta { padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.work-meta-top { display: flex; justify-content: space-between; align-items: center; }
.work-cat { font-size: 12px; color: var(--text-3); }
.work-year { font-family: var(--font-en); font-size: 12px; font-weight: 500; color: var(--text-4); }
.work-title { font-size: 17px; font-weight: 600; line-height: 1.4; }
.work-desc { font-size: 13px; color: var(--text-2); line-height: 1.6; }
.work-link-arrow { color: var(--accent); font-size: 12px; margin-left: auto; }

/* ---------- 技能与软件 ---------- */
.skills { background: var(--bg-section); padding: 88px 80px; display: flex; flex-direction: column; gap: 40px; }
.skills-body { display: flex; gap: 48px; align-items: flex-start; }
.skills-list { flex: 1; min-width: 0; }
.skill-row { display: flex; align-items: center; gap: 20px; padding: 18px 0; }
.skill-row + .skill-row { border-top: 1px solid var(--line); }
.skill-num { font-family: var(--font-en); font-size: 13px; font-weight: 500; color: var(--text-4); flex: none; }
.skill-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.skill-name { font-size: 16px; font-weight: 500; }
.skill-desc { font-size: 12px; color: var(--text-3); }
.skill-track { width: 110px; height: 4px; background: var(--card-2); flex: none; }
.skill-fill { height: 4px; background: #fff; }

.soft-col { width: 460px; flex: none; display: flex; flex-direction: column; gap: 16px; }
.soft-title { font-size: 18px; font-weight: 600; }
.soft-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.soft-cell { background: var(--card); border: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.soft-glyph-box { width: 40px; height: 40px; background: var(--card-2); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--font-en); font-size: 13px; font-weight: 600; overflow: hidden; }
.soft-glyph-box.is-img { background: none; overflow: visible; }
.soft-glyph-box svg, .soft-glyph-box img { width: 32px; height: 32px; display: block; border-radius: 7px; box-shadow: 0 2px 10px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06); transition: transform .3s cubic-bezier(.22,1,.36,1); }
.soft-glyph-box img { object-fit: cover; }
.soft-cell:hover .soft-glyph-box svg, .soft-cell:hover .soft-glyph-box img { transform: scale(1.12); }
.soft-name { font-size: 13px; font-weight: 500; line-height: 1.3; }
.soft-level { font-size: 12px; color: var(--text-3); }
.soft-note { font-size: 12px; color: var(--text-4); line-height: 1.6; }

/* ---------- 联系方式 ---------- */
.contact { background: #000; padding: 96px 80px; display: flex; flex-direction: column; gap: 44px; }
.contact-body { display: flex; gap: 64px; align-items: center; }
.contact-left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.contact-title { font-size: 44px; font-weight: 600; line-height: 1.25; white-space: pre-line; }
.contact-sub { font-size: 15px; color: var(--text-2); line-height: 1.8; max-width: 520px; }
.contact-card { width: 480px; flex: none; background: #0F0F0F; border: 1px solid var(--line); }
.contact-row { display: flex; align-items: center; gap: 16px; padding: 22px 24px; }
.contact-row + .contact-row { border-top: 1px solid var(--line); }
.contact-icon-box { width: 36px; height: 36px; background: var(--card); border-radius: 6px; display: flex; align-items: center; justify-content: center; flex: none; }
.contact-icon-box svg { width: 16px; height: 16px; }
.contact-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.contact-label { font-size: 12px; color: var(--text-3); }
.contact-value { font-family: var(--font-en); font-size: 17px; font-weight: 500; word-break: break-all; }
.contact-value.cn { font-family: var(--font-cjk); }
.social-chips { display: flex; gap: 10px; flex-wrap: wrap; }
.social-chip {
  display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 16px;
  border: 1px solid #333; border-radius: 100px; font-size: 12px; color: #C9C9C9;
  transition: border-color .15s, color .15s;
}
.social-chip:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- 页脚 ---------- */
.footer { background: #000; border-top: 1px solid var(--line); padding: 36px 80px; display: flex; flex-direction: column; gap: 18px; }
.footer-row { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.footer-brand { font-family: var(--font-en); font-size: 13px; font-weight: 500; color: var(--text-2); }
.footer-links { display: flex; gap: 24px; }
.footer-links a { font-size: 12px; color: var(--text-3); }
.footer-links a:hover { color: var(--text); }
.footer-copy { font-size: 12px; color: var(--text-4); }
.footer-note { font-size: 12px; color: var(--text-4); }

/* ---------- 案例详情页 ---------- */
.back-bar { display: flex; align-items: center; gap: 10px; padding: 36px 80px 0; }
.back-bar a { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-2); }
.back-bar a:hover { color: var(--text); }
.back-bar svg { width: 16px; height: 16px; }

.case-header { padding: 28px 80px 0; display: flex; flex-direction: column; gap: 18px; }
.case-meta-row { display: flex; gap: 32px; flex-wrap: wrap; }
.case-meta { display: inline-flex; align-items: center; gap: 8px; }
.case-meta .l { font-size: 12px; color: var(--text-4); }
.case-meta .v { font-size: 13px; font-weight: 500; color: #C9C9C9; }
.case-title { font-size: 48px; font-weight: 600; line-height: 1.2; }

.player-section { padding: 24px 80px 0; }
.player {
  position: relative; aspect-ratio: 16/9; background: #000;
  border: 1px solid var(--line); overflow: hidden;
}
.player video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; /* 保持原始宽高比，绝不拉伸或裁切 */
  background: #000; display: none;
}
.player.playing video { display: block; }

/* ============================================================
   过渡动画与交互效果
   ============================================================ */

/* 滚动进入动画（IntersectionObserver 添加 .in） */
.reveal {
  opacity: 0; transform: translateY(26px);
  transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1);
}
.reveal.in { opacity: 1; transform: none; }
.reveal[data-d="1"] { transition-delay: .07s; }
.reveal[data-d="2"] { transition-delay: .14s; }
.reveal[data-d="3"] { transition-delay: .21s; }
.reveal[data-d="4"] { transition-delay: .28s; }

/* 首屏/视图载入动画 */
@keyframes viewIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}
main > section:not(.hero), main > header, main > div.back-bar { animation: viewIn .55s cubic-bezier(.22,1,.36,1) both; }
#workModal { animation: viewIn .28s ease both; }

/* 导航 hover 下划线 */
.nav-link:not(.active)::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -6px; height: 2px;
  background: rgba(255,255,255,.45); transform: scaleX(0); transform-origin: center;
  transition: transform .25s ease;
}
.nav-link:not(.active):hover::after { transform: scaleX(1); }

/* 按钮交互增强 */
.btn { transition: transform .18s ease, opacity .18s ease, box-shadow .25s ease, border-color .2s ease; }
.btn-primary:hover { opacity: .9; box-shadow: 0 8px 28px rgba(158,255,0,.22); }
.btn-ghost:hover { border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.04); }
.btn-nav { transition: transform .18s ease, opacity .18s ease; }
.btn-nav:hover { opacity: .9; transform: translateY(-1px); }

/* 作品卡悬浮 */
.work-card { transition: border-color .25s ease, transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s ease; }
.work-card:hover { border-color: #3D3D3D; transform: translateY(-4px); box-shadow: 0 14px 36px rgba(0,0,0,.5); }

/* 方向卡 / 软件格悬浮 */
.spec-card, .soft-cell { transition: border-color .25s ease, transform .25s cubic-bezier(.22,1,.36,1), background .25s ease; }
.spec-card:hover, .soft-cell:hover { border-color: #3D3D3D; transform: translateY(-2px); }
.soft-cell:hover { background: #1F1F1F; }

/* Showreel 播放按钮呼吸脉冲 */
@keyframes pulseRing {
  0%   { box-shadow: 0 0 0 0 rgba(255,255,255,.32), 0 8px 32px rgba(0,0,0,.45); }
  70%  { box-shadow: 0 0 0 16px rgba(255,255,255,0), 0 8px 32px rgba(0,0,0,.45); }
  100% { box-shadow: 0 0 0 0 rgba(255,255,255,0), 0 8px 32px rgba(0,0,0,.45); }
}
.showreel .play-btn { animation: pulseRing 2.6s cubic-bezier(.22,1,.36,1) infinite; }

/* 技能条填充过渡 */
.skill-fill { transition: width 1.1s cubic-bezier(.22,1,.36,1); }

/* 视频弹窗淡入缩放 */
.video-modal {
  position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.88);
  display: flex; align-items: center; justify-content: center; padding: 24px;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .3s ease, visibility .3s ease;
}
.video-modal.open { opacity: 1; visibility: visible; pointer-events: auto; }
.video-modal-inner { transform: scale(.96) translateY(10px); transition: transform .32s cubic-bezier(.22,1,.36,1); }
.video-modal.open .video-modal-inner { transform: none; }

/* 后台访问记录 */
.log-row {
  display: flex; align-items: center; gap: 14px; padding: 12px 16px;
  border: 1px solid var(--line); border-radius: 6px; background: #0F0F0F; font-size: 13px;
}

}

.log-badge.action { background: rgba(158,255,0,.12); color: var(--accent); }

/* 降低动态偏好时关闭动画 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; scroll-behavior: auto !important;
  }
  .reveal { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {

}
.nav { transition: background .3s ease, box-shadow .3s ease, backdrop-filter .3s ease; }

/* ---------- 打印 / 导出 PDF ---------- */

}

  function softIcon(s) {

  /* ============================================================
     数字滚动动画（统计格进入视口时触发）
     ============================================================ */
  function countUp(el) {
    if (el.dataset.counted) return;
    var txt = el.textContent || '';
    var m = txt.match(/^(\d+)(.*)$/);
    if (!m) return;
    el.dataset.counted = '1';
    var target = parseInt(m[1], 10);
    var suffix = m[2] || '';
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      el.textContent = target + suffix;
      return;
    }
    var dur = 1100, start = null;
    function step(ts) {
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = target + suffix;
    }
    requestAnimationFrame(step);
  }

  /* ============================================================
     过渡动画：滚动进入 + 视图切换
     ============================================================ */
  var revealObserver = null;
  function observeReveals() {
    if (!revealObserver) return;
    document.querySelectorAll('.reveal:not(.in)').forEach(function (el) { revealObserver.observe(el); });
  }
  function initRevealObserver() {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
      return;
    }
    if (revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add('in');
          revealObserver.unobserve(en.target);
          en.target.querySelectorAll('.stat-num').forEach(function (n) { countUp(n); });
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -36px 0px' });
    observeReveals();
  }
  function markReveals() {
    var sels = [
      '.sec-head', '.portrait', '.intent-card', '.bio',
      '.spec-card', '.stat-cell', '.work-card', '.skill-row', '.soft-col', '.soft-cell',
      '.contact-card', '.tech-item', '.case-info-card', '.tools-block', '.mini-card', '.soft-note'
    ];
    sels.forEach(function (sel) {
      document.querySelectorAll(sel).forEach(function (el, i) {
        if (el.classList.contains('reveal')) return;
        el.classList.add('reveal');
        el.setAttribute('data-d', String((i % 4) + 1));
        if (!revealObserver) el.classList.add('in');
      });
    });
    observeReveals();
  }

  /* ============================================================
     访问记录与操作日志（localStorage）
     ============================================================ */
  var LOG_KEY = 'portfolio_activity_log';
  var LOG_MAX = 500;
  function loadLog() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; } catch (e) { return []; }
  }
  function saveLog(list) {
    try { localStorage.setItem(LOG_KEY, JSON.stringify(list)); } catch (e) { /* 存储满时忽略 */ }
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function logActivity(kind, action, detail) {
    var list = loadLog();
    list.unshift({ ts: Date.now(), kind: kind, action: action, detail: detail || '' });
    if (list.length > LOG_MAX) list = list.slice(0, LOG_MAX);
    saveLog(list);
  }
  function renderActivity() {
    var list = loadLog();
    var visits = list.filter(function (r) { return r.kind === 'visit'; }).length;
    var actions = list.filter(function (r) { return r.kind === 'action'; }).length;
    var last = list.length ? fmtTime(list[0].ts) : '—';
    $('activitySummary').innerHTML =
      '<div class="log-summary-cell"><span class="n">' + visits + '</span><span class="t">访问次数</span></div>' +
      '<div class="log-summary-cell"><span class="n">' + actions + '</span><span class="t">操作次数</span></div>' +
      '<div class="log-summary-cell"><span class="n">' + list.length + '</span><span class="t">记录总数（上限 500）</span></div>' +
      '<div class="log-summary-cell"><span class="n" style="font-size:14px;">' + esc(last) + '</span><span class="t">最近活动时间</span></div>';
    $('activityList').innerHTML = list.length ? list.map(function (r) {
      var badge = r.kind === 'visit'
        ? '<span class="log-badge visit">访问</span>'
        : '<span class="log-badge action">操作</span>';
      return '<div class="log-row">' + badge +
        '<span class="log-time">' + fmtTime(r.ts) + '</span>' +
        '<span class="log-action">' + esc(r.action) + '</span>' +
        '<span class="log-detail">' + esc(r.detail) + '</span></div>';
    }).join('') : '<p class="admin-panel-desc">暂无记录。访问网站或进行后台操作后，记录将显示在这里。</p>';
  }
  document.querySelectorAll('.admin-tab').forEach(function (t) {
    t.addEventListener('click', function () {
      if (t.getAttribute('data-tab') === 'activity') renderActivity();
    });
  });
  var clearLogBtn = $('clearLogBtn');
  if (clearLogBtn) {
    clearLogBtn.addEventListener('click', function () {
      if (!confirm('确定清空全部访问与操作记录？此操作不可恢复。')) return;
      saveLog([]);
      renderActivity();
    });
  }

  /* ============================================================
     视频弹窗
     ============================================================ */
  var videoModal = $('videoModal');
  var lastFocused = null;
  function openVideo(videoUrl, posterUrl, trigger) {
    var body = $('videoModalBody');
    var tip = $('videoModalTip');
    if (videoUrl) {
      body.innerHTML = '<video src="' + esc(videoUrl) + '" poster="' + esc(posterUrl || '') + '" controls autoplay loop muted playsinline></video>';
      tip.textContent = '如无法自动播放，请点击视频中央的播放按钮';
    } else {
      var email = (CONTENT.contact || {}).email || '';
      body.innerHTML = posterUrl
        ? '<img src="' + esc(posterUrl) + '" alt="视频封面" loading="eager" />'
        : '<div class="video-modal-empty">视频整理中</div>';
      tip.innerHTML = '该作品视频正在整理中' + (email
        ? '，可<a href="mailto:' + esc(email) + '?subject=' + encodeURIComponent('索取作品完整视频') + '">邮件联系</a>获取完整成片。'
        : '，欢迎通过邮件联系。');
    }
    lastFocused = trigger || document.activeElement;
    videoModal.classList.add('open');
    videoModal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    setTimeout(function () {
      var closeBtn = $('videoModalClose');
      if (closeBtn && videoModal.classList.contains('open')) closeBtn.focus();
    }, 50);
  }
  function closeVideo() {
    var body = $('videoModalBody');
    var v = body && body.querySelector('video');
    if (v) { try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) { /* 忽略 */ } }
    videoModal.classList.remove('open');
    videoModal.setAttribute('aria-hidden', 'true');
    if (body) body.innerHTML = '';
    document.body.style.overflow = '';
    if (lastFocused && document.contains(lastFocused)) {
      try { lastFocused.focus(); } catch (e) { /* 忽略 */ }
    }
    lastFocused = null;
  }
  $('videoModalClose').addEventListener('click', closeVideo);
  videoModal.addEventListener('click', function (e) { if (e.target === videoModal) closeVideo(); });
  document.addEventListener('keydown', function (e) {
    if (!videoModal.classList.contains('open')) return;
    if (e.key === 'Escape') { closeVideo(); return; }
    if (e.key !== 'Tab') return;
    var focusables = videoModal.querySelectorAll('button, [href], video, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    var first = focusables[0];
    var last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.play-btn');
    if (!btn) return;
    if (btn.closest('.player')) return; // 案例页内联播放器自行处理，不弹窗
    e.preventDefault();
    openVideo(btn.getAttribute('data-video'), btn.getAttribute('data-poster'), btn);
  });

  /* ============================================================
     视图路由
     ============================================================ */
  var views = { home: $('view-home'), case: $('view-case'), admin: $('view-admin') };
  var currentView = '';
  var homeRendered = false;
  // 静态发布时可移除后台视图（见 build_spa.py），此时后台相关逻辑全部跳过
  var ADMIN_ENABLED = !!views.admin;

  function siteTitle() {
    var p = CONTENT.profile || {};
    return (p.name || '张君睿') + ' · 视频剪辑师 — 求职作品集';
  }
  function renderCommon() {
    var p = CONTENT.profile || {};
    if (p.name) $('navName').textContent = p.name;
    $('footerBrand').textContent = (CONTENT.footer || {}).brand || '';
    $('footerNote').textContent = (CONTENT.footer || {}).note || '';
    document.title = siteTitle();
  }
  function pauseVideos(root) {
    if (!root) return;
    root.querySelectorAll('video').forEach(function (v) {
      try { v.pause(); } catch (e) { /* 忽略 */ }
    });
  }
  function setNavActive(name) {
    document.querySelectorAll('.nav-link').forEach(function (a) {
      a.classList.remove('active');
      a.removeAttribute('aria-current');
    });
    var key = name === 'case' ? 'works' : name;
    var link = document.querySelector('.nav-link[data-nav="' + key + '"]');
    if (link) {
      link.classList.add('active');
      link.setAttribute('aria-current', 'page');
    }
  }

  function showView(name, forceScroll) {
    if (!views[name]) return;
    var changed = currentView !== name;
    if (changed) {
      if (videoModal && videoModal.classList.contains('open')) closeVideo();
      Object.keys(views).forEach(function (k) {
        if (!views[k]) return;
        if (k === name) views[k].style.display = '';
        else { pauseVideos(views[k]); views[k].style.display = 'none'; }
      });
      currentView = name;
    }
    // 同一视图内切换作品（案例 A → 案例 B）也要回到顶部
    if (changed || forceScroll) window.scrollTo(0, 0);
    setNavActive(name);
    var skip = document.querySelector('.skip-link');
    if (skip) skip.setAttribute('href', name === 'case' ? '#view-case' : (name === 'admin' ? '#view-admin' : '#view-home'));
    if (name === 'home') document.title = siteTitle();
    else if (name === 'admin') document.title = '后台管理 — 剪辑师作品集';
    // case 的标题由 renderCase 设置
    if (changed) {
      var el = views[name];
      if (el && typeof el.animate === 'function') {
        el.animate(
          [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }],
          { duration: 420, easing: 'cubic-bezier(.22,1,.36,1)' }
        );
      }
    }
  }

  function route() {
    var h = location.hash || '';
    if (h.indexOf('#admin') === 0) {
      // 后台视图未随静态版发布时，直接回首页，避免进入一个改了也不生效的假后台
      if (!ADMIN_ENABLED) { location.replace('#/'); return; }
      showView('admin');
      initAdmin();
      logActivity('visit', '进入后台页面', '');
    } else if (h.indexOf('#case=') === 0) {
      var id = decodeURIComponent(h.slice(6));

  /* ============================================================
     案例页内联播放器：真实控件 + 可拖动进度条
     ============================================================ */
  var PLAYER_SVG = {
    play: '<svg viewBox="0 0 18 18" fill="none"><path d="M3 2L15 9L3 16V2Z" fill="#FFFFFF"/></svg>',
    pause: '<svg viewBox="0 0 18 18" fill="none"><path d="M4 2H7V16H4ZM11 2H14V16H11Z" fill="#FFFFFF"/></svg>',
    vol: '<svg viewBox="0 0 18 18" fill="none"><path d="M2 6V12H4.5L8.5 15.5V2.5L4.5 6H2Z" stroke="#FFFFFF" stroke-width="1.5"/><path d="M11.5 6C12.8 7.2 12.8 10.8 11.5 12" stroke="#FFFFFF" stroke-width="1.5"/><path d="M14 4C16.2 6 16.2 12 14 14" stroke="#FFFFFF" stroke-width="1.5"/></svg>',
    muted: '<svg viewBox="0 0 18 18" fill="none"><path d="M2 6V12H4.5L8.5 15.5V2.5L4.5 6H2Z" stroke="#FFFFFF" stroke-width="1.5"/><path d="M11 6.5L15 11.5M15 6.5L11 11.5" stroke="#FFFFFF" stroke-width="1.5"/></svg>',
    full: '<svg viewBox="0 0 18 18" fill="none"><path d="M1.5 6V1.5H6M12 1.5H16.5V6M16.5 12V16.5H12M6 16.5H1.5V12" stroke="#FFFFFF" stroke-width="1.5"/></svg>'
  };
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function setupCasePlayer(player, src, posterSrc, fallbackDurationText) {
    if (!player || player.dataset.playerReady) return;
    player.dataset.playerReady = '1';
    var video = document.createElement('video');
    video.className = 'player-video';
    video.preload = 'metadata';
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    if (src) video.src = src;
    player.insertBefore(video, player.firstChild);

    var playBtn = player.querySelector('.play-btn');
    var toggle = player.querySelector('.ctrl-toggle');
    var timeEl = player.querySelector('.ctrl-time');
    var track = player.querySelector('.ctrl-track');
    var fill = player.querySelector('.ctrl-fill');
    var muteBtn = player.querySelector('.ctrl-mute');
    var fullBtn = player.querySelector('.ctrl-full');
    var duration = 0;
    var dragging = false;
    if (!src) player.classList.add('no-video');
    if (fallbackDurationText) timeEl.textContent = '00:00 / ' + fallbackDurationText;

    track.setAttribute('role', 'slider');
    track.setAttribute('tabindex', '0');
    track.setAttribute('aria-label', '播放进度');
    track.setAttribute('aria-valuemin', '0');
    track.setAttribute('aria-valuemax', '100');
    track.setAttribute('aria-valuenow', '0');
    track.setAttribute('aria-valuetext', '00:00 / ' + (fallbackDurationText || '00:00'));

    function paint(cur) {
      var pct = duration ? Math.min(100, (cur / duration) * 100) : 0;
      fill.style.width = pct + '%';
      timeEl.textContent = fmtClock(cur) + ' / ' + fmtClock(duration);
      track.setAttribute('aria-valuenow', String(Math.round(pct)));
      track.setAttribute('aria-valuetext', fmtClock(cur) + ' / ' + fmtClock(duration));
    }
    video.addEventListener('loadedmetadata', function () {
      duration = video.duration || 0;
      paint(video.currentTime);
    });
    video.addEventListener('timeupdate', function () {
      if (!dragging) paint(video.currentTime);
    });
    video.addEventListener('play', function () { toggle.innerHTML = PLAYER_SVG.pause; });
    video.addEventListener('pause', function () { toggle.innerHTML = PLAYER_SVG.play; });
    video.addEventListener('ended', function () {
      player.classList.remove('playing');
      toggle.innerHTML = PLAYER_SVG.play;
      video.currentTime = 0;
    });

    playBtn.addEventListener('click', function () {
      if (!src) { openVideo('', posterSrc, playBtn); return; }
      player.classList.add('playing');
      video.play().catch(function () {});
    });
    toggle.addEventListener('click', function () {
      if (video.paused) video.play().catch(function () {}); else video.pause();
    });
    muteBtn.addEventListener('click', function () {
      video.muted = !video.muted;
      muteBtn.innerHTML = video.muted ? PLAYER_SVG.muted : PLAYER_SVG.vol;
    });
    fullBtn.addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (player.requestFullscreen) player.requestFullscreen();
      else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
    });

    // 进度条：点击定位 + 按住拖动（Pointer Events，鼠标/触屏通用），拖动时实时同步播放位置
    function seekFromEvent(e) {
      var rect = track.getBoundingClientRect();
      if (!rect.width) return;
      var x = (e.clientX - rect.left) / rect.width;
      x = Math.max(0, Math.min(1, x));
      fill.style.width = (x * 100) + '%';
      if (duration) {
        video.currentTime = x * duration;
        timeEl.textContent = fmtClock(video.currentTime) + ' / ' + fmtClock(duration);
      }
    }
    track.addEventListener('pointerdown', function (e) {
      if (!duration) return;
      dragging = true;
      track.classList.add('dragging');
      if (track.setPointerCapture) { try { track.setPointerCapture(e.pointerId); } catch (err) {} }
      seekFromEvent(e);
      e.preventDefault();
    });
    track.addEventListener('pointermove', function (e) { if (dragging) seekFromEvent(e); });
    track.addEventListener('pointerup', function () { dragging = false; track.classList.remove('dragging'); });
    track.addEventListener('pointercancel', function () { dragging = false; track.classList.remove('dragging'); });
    track.addEventListener('keydown', function (e) {
      if (!duration) return;
      var step = e.shiftKey ? 10 : 5;
      var next = video.currentTime;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') next -= step;
      else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') next += step;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = duration;
      else return;
      e.preventDefault();
      video.currentTime = Math.max(0, Math.min(duration, next));
      paint(video.currentTime);
    });
  }

  /* ============================================================
     后台管理（静态版：localStorage）
     说明：build_spa.py 默认会裁掉 ADMIN_START / ADMIN_END 之间的整段，
     使公开发布的静态版不含后台入口（改动本来就只存本地，无法生效）。
     本地预览需要后台时，用 python scripts/build_spa.py --keep-admin 构建。
     ============================================================ */
  
  /* ============================================================
     启动
     ============================================================ */
  renderCommon();
  initRevealObserver();
  route();

  // 导航栏滚动态（加深背景 + 毛玻璃）
  var navEl = document.querySelector('.nav');
  window.addEventListener('scroll', function () {
    if (!navEl) return;
    if (window.scrollY > 8) navEl.classList.add('scrolled');
    else navEl.classList.remove('scrolled');
  }, { passive: true });
})();

  </script>
